{% extends "base.html" %}{% block content %}<div class="hero"><img class="hero-logo" src="{{url_for('static',filename='img/logo.png')}}" alt="{{app_name}}"><p>Create your account</p></div><div class="container"><div class="card auth"><h2>Register</h2>{% if error %}<div class="error">{{error}}</div>{% endif %}<form method="post"><label>Name</label><input name="name" required><label>Email</label><input type="email" name="email" required><label>Phone</label><input name="phone" required><label>Password</label><input type="password" name="password" required><button class="full">Create Account</button></form><p class="center">Already registered? <a href="{{url_for('login')}}">Login</a></p></div></div>{% endblock %}
